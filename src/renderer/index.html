<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻驭</title>
    <!-- 深色底色内联，避免启动瞬间白屏闪烁；启动过场（splash）为纯 HTML/CSS，
         bundle 解析期间即可见，React 挂载后由 main.tsx 淡出移除。
         色板对齐 styles/tokens.css 暗色主题：#131315 暖灰底 + --accent #7c8da4 柔蓝灰点缀，
         沿用「台灯氛围」签名元素；光影语言走「静奢」路线：缓旋极光(50s) + 拖尾流星（场景光痕 +
         标题彗星，亮头渐隐尾）+ 尘埃漂移 + 徽标慢呼吸光晕，无任何闪烁/快速旋转元素 -->
    <style>
      html, body { background: #131315; margin: 0; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* 台灯光（左上，--lamp-glow 加强版）+ 暖灰纵向过渡（s1 → bg）*/
        background:
          radial-gradient(ellipse 75% 50% at 16% 0%, rgba(124, 141, 164, 0.10), transparent 62%),
          linear-gradient(180deg, #1a1a1c 0%, #131315 52%, #0f0f11 100%);
        color: #e8e4df;
        font-family: "Outfit", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #boot-splash::after {
        /* 暗角：压暗四周，聚焦中央品牌 */
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(ellipse 90% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.34));
      }
      #boot-splash.boot-splash--hide { opacity: 0; pointer-events: none; }

      /* ---- 流动光影：极光（柔蓝灰双色臂，缓旋）---- */
      .boot-splash__aurora {
        position: absolute;
        left: 50%;
        top: 45%;
        width: 980px;
        height: 980px;
        margin: -490px 0 0 -490px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(124, 141, 164, 0.13) 55deg,
          transparent 130deg,
          rgba(138, 154, 176, 0.09) 210deg,
          transparent 290deg
        );
        filter: blur(64px);
        animation: splash-rotate 50s linear infinite;
      }
      .boot-splash__aurora--warm {
        /* 一缕暖金（--warn），呼应「温暖藏在细节里」；静止不旋，只慢呼吸 */
        left: 20%;
        top: 8%;
        width: 560px;
        height: 560px;
        margin: -280px 0 0 -280px;
        filter: none;
        background: radial-gradient(circle, rgba(196, 162, 101, 0.07), transparent 62%);
        animation: splash-breathe 14s ease-in-out infinite alternate;
      }
      @keyframes splash-rotate { to { transform: rotate(360deg); } }
      @keyframes splash-breathe { from { opacity: 0.7; } to { opacity: 1; } }

      /* ---- 流动光影：拖尾流星（亮头在前，尾迹拖在飞行方向后方，自台灯方向斜向穿行）---- */
      .boot-splash__streak {
        position: absolute;
        width: var(--len, 220px);
        height: 1px;
        /* 90deg 渐变：左端为尾（渐隐），右端为亮头——与 translateX 正向飞行一致 */
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(138, 154, 176, 0.05) 30%,
          rgba(138, 154, 176, 0.16) 55%,
          rgba(176, 192, 212, 0.42) 80%,
          rgba(214, 226, 240, 0.85) 94%,
          transparent 100%);
        transform: rotate(var(--br, 32deg));
        opacity: 0;
        animation: splash-streak var(--sd, 8s) linear var(--sdl, 0s) infinite;
      }
      @keyframes splash-streak {
        0%   { transform: rotate(var(--br, 32deg)) translateX(-40px); opacity: 0; }
        10%  { opacity: 1; }
        80%  { opacity: 0.5; }
        100% { transform: rotate(var(--br, 32deg)) translateX(var(--tr, 380px)); opacity: 0; }
      }

      /* ---- 流动光影：尘埃（台灯光束里缓速漂移的微粒）---- */
      .boot-splash__p {
        position: absolute;
        width: var(--s, 3px);
        height: var(--s, 3px);
        border-radius: 50%;
        background: var(--c, #8a9ab0);
        box-shadow: 0 0 7px 1px var(--g, rgba(124, 141, 164, 0.6));
        opacity: 0;
        animation: splash-mote var(--pd, 13s) linear var(--pdl, 0s) infinite;
      }
      @keyframes splash-mote {
        0%   { transform: translate(0, 0) scale(1); opacity: 0; }
        12%  { opacity: var(--o, 0.7); }
        82%  { opacity: calc(var(--o, 0.7) * 0.35); }
        100% { transform: translate(var(--mx, 120px), var(--my, 150px)) scale(0.85); opacity: 0; }
      }

      /* ---- 中央品牌 ---- */
      .boot-splash__brand {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .boot-splash__brand::before {
        /* 徽标后方的静止光晕：10s 慢呼吸（±15% 透明度），可感知而不抢眼 */
        content: '';
        position: absolute;
        top: -58px;
        left: 50%;
        width: 184px;
        height: 184px;
        margin-left: -92px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(124, 141, 164, 0.10), transparent 65%);
        animation: splash-breathe 10s ease-in-out infinite alternate;
      }
      .boot-splash__logo {
        /* 静态铭牌：发丝线描边 + 顶缘内嵌高光撑起材质感，徽标本体不做任何动画 */
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 1px solid rgba(124, 141, 164, 0.32);
        background: linear-gradient(180deg, rgba(124, 141, 164, 0.10), rgba(124, 141, 164, 0.04));
        box-shadow: inset 0 1px 0 rgba(232, 228, 223, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Instrument Serif", "PingFang SC", "Microsoft YaHei UI", Georgia, serif;
        font-size: 32px;
        color: #cfd6e0;
      }
      .boot-splash__title {
        font-family: "Instrument Serif", "PingFang SC", "Microsoft YaHei UI", Georgia, serif;
        font-size: 46px;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-indent: 0.14em; /* 视觉居中补偿字距 */
        /* 拖尾流星掠过字面：亮头 + 渐隐长尾自右向左划过，9s 一遇（划过约 1.8s），
           其余时间字面保持安静的 --fg-2 基色 */
        background: linear-gradient(110deg,
          #a8a29e 0%, #a8a29e 56.5%,
          #ffffff 58.5%, #ffffff 60%,
          #d8d3cc 61.5%, #c6c1ba 66%, #b4afa8 72%, #a9a39c 80%, #a8a29e 86%,
          #a8a29e 100%);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splash-comet 9s linear infinite;
      }
      @keyframes splash-comet {
        0%, 42%   { background-position: 0% 0; }   /* 静候：流星在画面外 */
        72%, 100% { background-position: 100% 0; } /* 划过后归于安静 */
      }
      .boot-splash__tag {
        font-size: 11px;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #6b6560;
      }
      .boot-splash__feats {
        display: flex;
        gap: 28px;
        margin-top: 10px;
      }
      .boot-splash__feat {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #a8a29e;
      }
      .boot-splash__feat i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #7c8da4;
        box-shadow: 0 0 6px rgba(124, 141, 164, 0.45);
      }
      .boot-splash__loader {
        position: relative;
        width: 26px;
        height: 26px;
        margin-top: 14px;
      }
      .boot-splash__loader::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(124, 141, 164, 0.26);
      }
      .boot-splash__orbit {
        position: absolute;
        inset: 0;
        animation: splash-spin 1.8s linear infinite;
      }
      .boot-splash__orbit::after {
        content: '';
        position: absolute;
        top: -2px;
        left: 50%;
        margin-left: -1.5px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #8a9ab0;
        box-shadow: 0 0 6px rgba(124, 141, 164, 0.55);
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }

      /* ---- 底部装饰字 ---- */
      .boot-splash__deco {
        position: absolute;
        bottom: 2rem;
        left: 0;
        right: 0;
        z-index: 2;
        text-align: center;
        font-size: 10px;
        letter-spacing: 1em;
        text-indent: 1em;
        color: rgba(232, 228, 223, 0.07);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash *,
        #boot-splash *::before,
        #boot-splash *::after,
        #boot-splash::before,
        #boot-splash::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="正在启动轻驭">
      <i class="boot-splash__aurora"></i>
      <i class="boot-splash__aurora boot-splash__aurora--warm"></i>

      <i class="boot-splash__streak" style="left: 6%; top: 24%; --len: 200px; --br: 30deg; --tr: 420px; --sd: 6.5s; --sdl: -1s"></i>
      <i class="boot-splash__streak" style="left: 30%; top: 10%; --len: 260px; --br: 38deg; --tr: 460px; --sd: 9s; --sdl: -6s"></i>
      <i class="boot-splash__streak" style="left: 55%; top: 68%; --len: 180px; --br: 26deg; --tr: 360px; --sd: 7.5s; --sdl: -3s"></i>
      <i class="boot-splash__streak" style="left: 70%; top: 30%; --len: 150px; --br: 42deg; --tr: 300px; --sd: 10s; --sdl: -8s"></i>

      <i class="boot-splash__p" style="left: 10%; top: 18%; --s: 3px; --mx: 130px; --my: 170px; --pd: 10s; --pdl: -2s; --o: 0.8"></i>
      <i class="boot-splash__p" style="left: 22%; top: 46%; --s: 2px; --mx: 110px; --my: 140px; --pd: 13s; --pdl: -7s; --o: 0.6"></i>
      <i class="boot-splash__p" style="left: 34%; top: 70%; --s: 3px; --mx: 90px; --my: 110px; --pd: 11s; --pdl: -4s; --o: 0.7"></i>
      <i class="boot-splash__p" style="left: 44%; top: 12%; --s: 2px; --mx: 150px; --my: 180px; --pd: 14s; --pdl: -9s; --o: 0.55; --c: #c4a265; --g: rgba(196, 162, 101, 0.45)"></i>
      <i class="boot-splash__p" style="left: 56%; top: 58%; --s: 4px; --mx: 120px; --my: 150px; --pd: 10.5s; --pdl: -6s; --o: 0.75"></i>
      <i class="boot-splash__p" style="left: 64%; top: 26%; --s: 2px; --mx: 100px; --my: 130px; --pd: 13.5s; --pdl: -11s; --o: 0.6"></i>
      <i class="boot-splash__p" style="left: 74%; top: 62%; --s: 3px; --mx: 140px; --my: 160px; --pd: 9s; --pdl: -3s; --o: 0.7"></i>
      <i class="boot-splash__p" style="left: 82%; top: 16%; --s: 2px; --mx: 110px; --my: 140px; --pd: 15s; --pdl: -13s; --o: 0.5; --c: #c4a265; --g: rgba(196, 162, 101, 0.4)"></i>
      <i class="boot-splash__p" style="left: 87%; top: 44%; --s: 3px; --mx: 120px; --my: 170px; --pd: 12s; --pdl: -8s; --o: 0.65"></i>
      <i class="boot-splash__p" style="left: 16%; top: 80%; --s: 2px; --mx: 90px; --my: 100px; --pd: 16s; --pdl: -14s; --o: 0.5"></i>

      <div class="boot-splash__brand">
        <div class="boot-splash__logo"><span>驭</span></div>
        <div class="boot-splash__title">轻驭</div>
        <div class="boot-splash__tag">AGENTIC DEVELOPMENT ENVIRONMENT</div>
        <div class="boot-splash__feats">
          <span class="boot-splash__feat"><i></i>智能编辑</span>
          <span class="boot-splash__feat"><i></i>Agent 协作</span>
          <span class="boot-splash__feat"><i></i>版本管理</span>
        </div>
        <div class="boot-splash__loader"><i class="boot-splash__orbit"></i></div>
      </div>

      <div class="boot-splash__deco">QYRIS</div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
